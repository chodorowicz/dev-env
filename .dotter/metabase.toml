[homebrew.files."homebrew/base.Brewfile"]
target = "~/Brewfile"
type = "template"
append = """

{{ include_template "homebrew/metabase.Brewfile" }}
"""

[zsh.files."zsh/zshrc/.zshrc"]
target = "~/.zshrc"
type = "template"
append = """

{{ include_template "zsh/zshrc/metabase.zshrc" }}
"""

[zsh.files."zsh/.zshenv"]
target = "~/.zshenv"
type = "template"
append = """

{{ include_template "zsh/zshenv/metabase.zshenv" }}
"""

[git.files."git/.gitconfig"]
target = "~/.gitconfig"
type = "template"
append = """

{{ include_template "git/metabase.gitconfig" }}
"""

[zsh.files]
"zsh/config-metabase/metabase.aliases.zsh" = "~/.config/zsh/metabase.aliases.zsh"

[mise.files]
"mise/metabase.config.toml" = "~/.config/mise/config.toml"
